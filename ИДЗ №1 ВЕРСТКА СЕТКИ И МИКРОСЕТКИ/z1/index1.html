<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вариант 13 - Фиксированный макет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fixed-container">
        <!-- ШАПКА -->
        <header class="block header">
            <div class="logo">
                <img src="img/logo.png" alt="Логотип" class="logo-img">
            </div>
            <nav class="horizontal-menu">
                <ul>
                    <li><a href="#">Главная</a></li>
                    <li><a href="#">О нас</a></li>
                    <li><a href="#">Услуги</a></li>
                    <li><a href="#">Портфолио</a></li>
                    <li><a href="#">Контакты</a></li>
                </ul>
            </nav>
        </header>

        <!-- ОСНОВНАЯ СЕТКА: 3 колонки -->
        <div class="main-grid">
            <!-- Левая колонка: блоки 1, 2, 3 -->
            <div class="left-col">
                <div class="block block-1">Блок 1</div>
                <div class="block block-2">Блок 2</div>
                <div class="block block-3">Блок 3</div>
            </div>

            <!-- Центральная колонка: блок 4 -->
            <div class="center-col">
                <div class="block block-4">Блок 4</div>
            </div>

            <!-- Правая колонка: блоки 5, 6 -->
            <div class="right-col">
                <div class="block block-5">Блок 5</div>
                <div class="block block-6">Блок 6</div>
            </div>
        </div>

        <!-- ПОДВАЛ -->
        <footer class="block footer">
            <div class="copyright">© 2026 Вариант 13</div>
            <div class="social-links">
                <a href="https://t.me/myukle" target="_blank">Telegram</a>
            </div>
        </footer>
    </div>
</body>
</html>
