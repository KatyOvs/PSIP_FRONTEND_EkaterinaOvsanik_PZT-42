<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дочернее окно</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h2>Дочернее окно</h2>
        <p id="msg">Ожидание сообщения…</p>
        <button onclick="replyToParent()">Ответить родителю</button>
        <button onclick="window.close()">Закрыть окно</button>
    </div>
    <script>
        window.addEventListener("message", (event) => {
            document.getElementById("msg").textContent = "Получено: " + event.data;
        });
        function replyToParent() {
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage(
                    { text: "Спасибо, родитель! Сообщение получено." }, "*"
                );
            }
        }
    </script>
</body>
</html>
